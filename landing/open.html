<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open in Divera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #050505;
      color: #EBEBEB;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background-color: #111113;
      border: 1px solid #232327;
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }

    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin: 0 auto 24px;
      display: block;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.3px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 16px;
      color: #9B9BA1;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .btn-primary {
      display: block;
      width: 100%;
      background-color: #FF5A62;
      color: #FFFFFF;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      padding: 16px 24px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      margin-bottom: 12px;
      transition: opacity 0.15s;
    }

    .btn-primary:hover { opacity: 0.88; }

    .btn-secondary {
      display: block;
      width: 100%;
      background-color: transparent;
      color: #9B9BA1;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 14px;
      border: 1px solid #232327;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-secondary:hover { border-color: #444; color: #EBEBEB; }

    .divider {
      border: none;
      border-top: 1px solid #232327;
      margin: 24px 0;
    }

    .footer {
      font-size: 13px;
      color: #7A7A7E;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <img
      class="logo"
      src="https://agatpmqbrpdhlfeinkmv.supabase.co/storage/v1/object/public/DiveraPhotos/divera-icon.png"
      alt="Divera"
    >
    <h1>Open in Divera</h1>
    <p class="subtitle">View this content in the Divera app for the best experience.</p>

    <button class="btn-primary" id="btn-open" onclick="openInApp()">
      Open in Divera
    </button>

    <a
      class="btn-secondary"
      href="https://apps.apple.com/app/id6759156407"
      id="btn-download"
    >
      Download on the App Store
    </a>

    <hr class="divider">
    <p class="footer">
      Don't have Divera yet? Download it free on the App Store and start logging your dives.
    </p>
  </div>

  <script>
    (function () {
      // Build divera:// deep link from the current URL path.
      // e.g. /dive-site/abc123  →  divera://dive-site/abc123
      var parts = window.location.pathname.split('/').filter(Boolean);
      var type  = parts[0]; // "dive-site"
      var id    = parts[1]; // "abc123"

      var deepLink = (type && id) ? ('divera://' + type + '/' + id) : null;

      function openInApp() {
        if (!deepLink) return;
        window.location.href = deepLink;
      }

      // Auto-attempt on load. If the app is installed, iOS will switch
      // immediately and the page stays in the background. If not, nothing
      // happens and the user sees the fallback buttons.
      if (deepLink) {
        setTimeout(openInApp, 100);
      }
    })();
  </script>
</body>
</html>
