<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divera</title>

  <!-- Rich link preview (WhatsApp / iMessage / social).
       Uses the branded 1200x630 card so shared links render correctly.
       The transparent wordmark logo is wrong for previews (invisible on
       light card backgrounds), so the share image is og-image-v2.jpg. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://divera.app/">
  <meta property="og:title" content="Divera — Life, understood underwater">
  <meta property="og:description" content="Open this in the Divera app.">
  <meta property="og:image" content="https://divera.app/og-image-v2.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Divera — Life, understood underwater">
  <meta name="twitter:description" content="Open this in the Divera app.">
  <meta name="twitter:image" content="https://divera.app/og-image-v2.jpg">

  <!-- Real visitors go straight to the App Store. Users with the app
       installed never reach this page — iOS intercepts the Universal Link
       (AASA) first. No-JS fallback via meta refresh. -->
  <meta http-equiv="refresh" content="0; url=https://apps.apple.com/app/id6759156407">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #050505;
      color: #EBEBEB;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background-color: #111113;
      border: 1px solid #232327;
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }

    /* Size by height only so the 2500x1024 wordmark keeps its aspect
       ratio (no forced square = no horizontal squish). */
    .logo {
      height: 48px;
      width: auto;
      max-width: 80%;
      margin: 0 auto 20px;
      display: block;
    }

    .subtitle {
      font-size: 16px;
      color: #9B9BA1;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <img
      class="logo"
      src="https://agatpmqbrpdhlfeinkmv.supabase.co/storage/v1/object/public/DiveraPhotos/divera-icon.png"
      alt="Divera"
    >
    <p class="subtitle">Opening the App Store&hellip;</p>
  </div>

  <script>
    location.replace("https://apps.apple.com/app/id6759156407");
  </script>
</body>
</html>
