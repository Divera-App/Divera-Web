<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divera</title>

  <!-- Rich link preview (WhatsApp / iMessage / social).
       Uses the branded 1200x630 card so shared links render correctly.
       The transparent wordmark logo is wrong for previews (invisible on
       light card backgrounds), so the share image is og-image-v2.jpg. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://divera.app/">
  <meta property="og:title" content="Divera — Life, understood underwater">
  <meta property="og:description" content="Open this in the Divera app.">
  <meta property="og:image" content="https://divera.app/og-image-v2.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Divera — Life, understood underwater">
  <meta name="twitter:description" content="Open this in the Divera app.">
  <meta name="twitter:image" content="https://divera.app/og-image-v2.jpg">

  <!-- No-JS fallback only: send straight to the App Store. JS (below) does
       the smarter "try the app first" flow when available. -->
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://apps.apple.com/app/id6759156407">
  </noscript>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #050505;
      color: #EBEBEB;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background-color: #111113;
      border: 1px solid #232327;
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }

    /* Size by height only so the 2500x1024 wordmark keeps its aspect
       ratio (no forced square = no horizontal squish). */
    .logo {
      height: 48px;
      width: auto;
      max-width: 80%;
      margin: 0 auto 20px;
      display: block;
    }

    .subtitle {
      font-size: 16px;
      color: #9B9BA1;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <img
      class="logo"
      src="https://agatpmqbrpdhlfeinkmv.supabase.co/storage/v1/object/public/DiveraPhotos/divera-icon.png"
      alt="Divera"
    >
    <p class="subtitle">Opening Divera&hellip;</p>
  </div>

  <script>
    (function () {
      var APP_STORE  = "https://apps.apple.com/app/id6759156407";
      var PLAY_STORE = "https://play.google.com/store/apps/details?id=com.divera";
      // Platform-aware fallback: Android → Google Play, everyone else → App Store.
      var STORE = /Android/.test(navigator.userAgent || "") ? PLAY_STORE : APP_STORE;

      // Reconstruct the content route. Normal path: /dive/<id> (kept intact
      // by the _redirects rewrite). Query fallback (?type=&id=) in case a
      // redirect ever moves the data off the path.
      function deepLink() {
        var parts = location.pathname.split("/").filter(Boolean);
        var type = parts[0];
        var id = parts[1];
        if (!id || type === "open" || type === "open.html") {
          var q = new URLSearchParams(location.search);
          if (q.get("id")) { type = q.get("type") || type; id = q.get("id"); }
        }
        if (!type || !id || type === "open" || type === "open.html") return null;
        return "divera://" + type + "/" + id;
      }

      var link = deepLink();

      // No content id (e.g. bare /open) → nothing to deep-link, go to store.
      if (!link) { location.replace(STORE); return; }

      // Try the app. If it grabs the link, the page is backgrounded and we
      // cancel the store jump. Universal Links don't re-fire from a loaded
      // page, so the custom scheme is the only in-page route to the app
      // (relevant for in-app browsers like Instagram/Facebook that bypass UL).
      var fallback = setTimeout(function () {
        location.replace(STORE);
      }, 1500);

      function cancel() { clearTimeout(fallback); }
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "hidden") cancel();
      });
      window.addEventListener("pagehide", cancel);

      window.location.href = link;
    })();
  </script>
</body>
</html>
