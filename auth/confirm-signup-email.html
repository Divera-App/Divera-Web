<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <title>Confirm your Divera account</title>
</head>
<body style="margin:0; padding:0; background-color:#050505; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#050505;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:380px;">
          <tr>
            <td align="center" style="padding:0 0 18px 0;">
              <img
                src="https://agatpmqbrpdhlfeinkmv.supabase.co/storage/v1/object/public/DiveraPhotos/divera-icon.png"
                alt="Divera"
                width="96"
                style="display:block; border:0; outline:none; text-decoration:none; width:96px; height:auto;"
              >
            </td>
          </tr>

          <tr>
            <td style="background-color:#111113; border:1px solid #232327; border-radius:14px; padding:28px 20px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#EBEBEB; font-size:30px; line-height:36px; font-weight:700; letter-spacing:-0.3px; padding:0 0 10px 0;">
                    Confirm your email
                  </td>
                </tr>
                <tr>
                  <td align="center" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#9B9BA1; font-size:18px; line-height:27px; font-weight:400; padding:0 4px 22px 4px;">
                    Tap the button below to confirm your email address and activate your Divera account.
                  </td>
                </tr>

                <tr>
                  <td align="center" style="padding:0 0 22px 0;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td align="center" bgcolor="#FF5A62" style="border-radius:12px;">
                          <a
                            href="{{ .ConfirmationURL }}"
                            style="display:inline-block; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#FFFFFF; font-size:18px; line-height:22px; font-weight:700; text-decoration:none; padding:14px 24px; border-radius:12px;"
                          >
                            Confirm email
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <tr>
                  <td style="border-top:1px solid #232327; padding:16px 0 0 0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#7A7A7E; font-size:14px; line-height:21px; text-align:center;">
                    If you didn’t create a Divera account, you can safely ignore this email.
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
